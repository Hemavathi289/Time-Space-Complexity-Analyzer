<!DOCTYPE html>
<html>
<head>
<title>Code Complexity Analyzer</title>

<style>

body{
    font-family: Arial;
    background: linear-gradient(135deg,#667eea,#764ba2);
    height:100vh;
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:70%;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    padding:30px;
    border-radius:15px;
    color:white;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

h1{
    text-align:center;
}

textarea{
    width:100%;
    height:250px;
    border:none;
    border-radius:10px;
    padding:15px;
    font-family:monospace;
    font-size:14px;
}

button{
    margin-top:15px;
    padding:12px 25px;
    border:none;
    border-radius:8px;
    background:#ff7eb3;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
    background:#ff4f9a;
}

.result{
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    background:rgba(0,0,0,0.3);
}

.hint{
    margin-left:20px;
}

.toggle{
    float:right;
    background:#222;
}

.dark{
    background:#111;
}

</style>

<script>

function toggleMode(){
    document.body.classList.toggle("dark");
}

</script>

</head>

<body>

<div class="container">

<button class="toggle" onclick="toggleMode()">🌙</button>

<h1>⚡ Code Complexity Analyzer</h1>

<form method="POST">

<textarea name="code" placeholder="Paste your Python code here...">{{code}}</textarea>
<br>

<button type="submit">Analyze Code</button>

</form>

{% if result %}

<div class="result">

<h3>{{ result }}</h3>

<ul>
{% for h in hints %}
<li class="hint">{{ h }}</li>
{% endfor %}
</ul>

</div>

{% endif %}

</div>

</body>
</html>
